# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx1536m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.vfs.watch=false

# Kotlin compiler settings
kotlin.daemon.jvmargs=-Xmx2304m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.incremental=true

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 built-in Kotlin opt-out — use explicit Kotlin plugin
android.builtInKotlin=false
android.newDsl=false

# Disable KSP2 to fix Dagger/Hilt WorkerAssistedFactory generic return type resolution
ksp.useKSP2=false

# Override AAPT2 with native aarch64 binary
android.aapt2FromMavenOverride=/root/android-sdk/build-tools/36.1.0/aapt2
